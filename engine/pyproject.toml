[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "schlomo-engine"
version = "0.1.0"
description = "Local engine for Schlomo und Adelheid (start types ui and mcp)"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "mcp==2.3.0",
    "jsonschema==4.26.0",
    "referencing==0.37.0",
    "platformdirs==4.14.8",
    "lxml==6.1.3",
    "openpyxl==3.1.5",
    "pikepdf==10.18.2",
    "pillow==13.0.0",
    "pillow_heif==1.8.1",
    "pypdfium2==5.15.2",
    "spacy==3.8.18",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "python-docx==1.2.0"]

[project.scripts]
engine = "schlomo_engine.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
